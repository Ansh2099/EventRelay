services:
  postgres:
    image: postgres:15-alpine
    container_name: eventrelay-postgres
    environment:
      POSTGRES_DB: event_relay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eventrelay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_relay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  eventrelay-postgres-data:
